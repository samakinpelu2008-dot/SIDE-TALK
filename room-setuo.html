<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Side Talk - Create / Join Room</title>
<link rel="stylesheet" href="styles.css">
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBbg9cxg6qGNYWyXxUKiJmBLojdXvZu6sU",
  authDomain: "side-chat-b2553.firebaseapp.com",
  projectId: "side-chat-b2553",
  storageBucket: "side-chat-b2553.firebasestorage.app",
  messagingSenderId: "1019895961728",
  appId: "1:1019895961728:web:4e229932ff0bd9b15b2e65"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// Create a new room
async function createRoom(){
  const name = prompt("Enter room name:");
  if(!name) return;
  const code = generateCode(6);
  await addDoc(collection(db,"rooms"),{
    name: name,
    code: code,
    members: 0,
    createdAt: serverTimestamp()
  });
  alert(`Room created! Code: ${code}`);
}

// Join existing room
async function joinRoom(){
  const code = document.getElementById("join-code").value.trim();
  if(!code) return alert("Enter room code!");
  const roomsCol = collection(db,"rooms");
  const snapshot = await getDocs(roomsCol);
  let found = false;
  snapshot.forEach(docSnap=>{
    const data = docSnap.data();
    if(data.code === code){
      found = true;
      sessionStorage.setItem("roomId", docSnap.id);
      sessionStorage.setItem("roomName", data.name);
      window.location.href="free-chat-room.html"; // go to room chat
    }
  });
  if(!found) alert("Room code not found!");
}

// Random alphanumeric code generator
function generateCode(length){
  const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
  let result="";
  for(let i=0;i<length;i++){
    result += chars.charAt(Math.floor(Math.random()*chars.length));
  }
  return result;
}
</script>
<style>
.page-container{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:30px;
  padding:50px;
}

input{
  width:250px;
  padding:12px;
  border-radius:12px;
  border:1px solid #D1D5DB;
  font-size:1rem;
}

button{
  padding:12px 25px;
  border-radius:12px;
  border:none;
  background:#6366F1;
  color:white;
  font-weight:bold;
  cursor:pointer;
  transition:transform 0.2s;
}

button:hover{
  transform:scale(1.05);
}
</style>
</head>
<body>
<header>
  <img src="logo.png" alt="Logo" class="zoom-logo">
  <span>Side Talk - Create / Join Room</span>
</header>

<div class="page-container">
  <button onclick="createRoom()">Create New Room</button>
  <div>
    <input type="text" id="join-code" placeholder="Enter Room Code">
    <button onclick="joinRoom()">Join Room</button>
  </div>
</div>

</body>
</html>
