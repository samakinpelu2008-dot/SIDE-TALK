<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Side Talk - Report / Safety</title>
<link rel="stylesheet" href="styles.css">
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBbg9cxg6qGNYWyXxUKiJmBLojdXvZu6sU",
  authDomain: "side-chat-b2553.firebaseapp.com",
  projectId: "side-chat-b2553",
  storageBucket: "side-chat-b2553.firebasestorage.app",
  messagingSenderId: "1019895961728",
  appId: "1:1019895961728:web:4e229932ff0bd9b15b2e65"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// Submit report
async function submitReport(){
  const category = document.getElementById("report-category").value.trim();
  const description = document.getElementById("report-description").value.trim();

  if(!category || !description){
    alert("Please fill in all fields!");
    return;
  }

  await addDoc(collection(db,"reports"),{
    category: category,
    description: description,
    timestamp: serverTimestamp()
  });

  alert("Report submitted successfully!");
  document.getElementById("report-form").reset();
}
</script>
<style>
.page-container{
  max-width:600px;
  margin:50px auto;
  display:flex;
  flex-direction:column;
  gap:25px;
  padding:20px;
}

input, select, textarea{
  width:100%;
  padding:12px;
  border-radius:12px;
  border:1px solid #D1D5DB;
  font-size:1rem;
  outline:none;
}

textarea{
  height:150px;
}

button{
  padding:12px 25px;
  border-radius:12px;
  border:none;
  background:#6366F1;
  color:white;
  font-weight:bold;
  cursor:pointer;
  transition:transform 0.2s;
}

button:hover{
  transform:scale(1.05);
}
</style>
</head>
<body>
<header>
  <img src="logo.png" alt="Logo" class="zoom-logo">
  <span>Side Talk - Report / Safety</span>
</header>

<div class="page-container">
  <form id="report-form" onsubmit="event.preventDefault(); submitReport();">
    <label for="report-category">Report Category</label>
    <select id="report-category">
      <option value="">Select Category</option>
      <option value="Abuse">Abuse</option>
      <option value="Spam">Spam</option>
      <option value="Harassment">Harassment</option>
      <option value="Other">Other</option>
    </select>

    <label for="report-description">Description</label>
    <textarea id="report-description" placeholder="Describe the issue..."></textarea>

    <button type="submit">Submit Report</button>
  </form>
</div>

</body>
</html>
