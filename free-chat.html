<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Side Talk - Free Chat Room</title>
<link rel="stylesheet" href="styles.css">
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBbg9cxg6qGNYWyXxUKiJmBLojdXvZu6sU",
  authDomain: "side-chat-b2553.firebaseapp.com",
  projectId: "side-chat-b2553",
  storageBucket: "side-chat-b2553.firebasestorage.app",
  messagingSenderId: "1019895961728",
  appId: "1:1019895961728:web:4e229932ff0bd9b15b2e65"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// Get room info from sessionStorage
const roomId = sessionStorage.getItem("roomId");
const roomName = sessionStorage.getItem("roomName");
document.addEventListener("DOMContentLoaded", ()=>{
  document.getElementById("room-title").textContent = `Room: ${roomName}`;
});

let username = "";
let clan = "";

// Clan selection (optional for free chat)
function selectClan(){
  const clans = ["shadow","ghost","phantom","viper"];
  clan = prompt("Choose a clan: shadow, ghost, phantom, viper");
  if(!clans.includes(clan)){
    alert("Invalid clan! Defaulting to 'shadow'");
    clan = "shadow";
  }
  generateUsername();
}

// Generate anonymous username
async function generateUsername(){
  const snap = await db.collection("users").where("clan","==",clan).get();
  const id = snap.size + 1;
  username = `${clan}${id.toString().padStart(4,"0")}`;
  document.getElementById("username-display").textContent = `You: ${username}`;
}

// Send message
async function sendMessage(){
  const input = document.getElementById("msg-input");
  const msg = input.value.trim();
  if(!msg) return;
  await addDoc(collection(db,`freeRooms/${roomId}/messages`),{
    username: username,
    clan: clan,
    text: msg,
    timestamp: serverTimestamp()
  });
  input.value = "";
}

// Load messages in real-time
function loadMessages(){
  const msgsDiv = document.getElementById("messages");
  const q = query(collection(db,`freeRooms/${roomId}/messages`), orderBy("timestamp"));
  onSnapshot(q, snapshot=>{
    msgsDiv.innerHTML="";
    snapshot.forEach((docSnap,index)=>{
      const data = docSnap.data();
      const div = document.createElement("div");
      div.className="message";
      div.innerHTML=`<span class="username">${data.username}</span><br>${data.text}`;
      msgsDiv.appendChild(div);

      // Banner ad after every 50 messages
      if((index+1) % 50 === 0){
        const ad = document.createElement("div");
        ad.className="banner-ad";
        ad.textContent="Banner Ad Here";
        msgsDiv.appendChild(ad);
      }

      // Delete messages older than 24h
      const now = new Date().getTime();
      if(data.timestamp){
        const msgTime = data.timestamp.toDate().getTime();
        if(now - msgTime > 24*60*60*1000){
          deleteDoc(doc(db,`freeRooms/${roomId}/messages`,docSnap.id));
        }
      }
    });
    msgsDiv.scrollTop = msgsDiv.scrollHeight;
  });
}

window.onload = ()=>{
  selectClan();
  loadMessages();
};
</script>
<style>
.chat-container{
  max-width:800px;
  margin:20px auto;
  display:flex;
  flex-direction:column;
  gap:10px;
}
#messages{
  border:1px solid #D1D5DB;
  border-radius:12px;
  padding:10px;
  height:500px;
  overflow-y:auto;
  background:#F3F4F6;
}
#msg-input{
  width:80%;
  padding:12px;
  border-radius:12px;
  border:1px solid #D1D5DB;
  outline:none;
  margin-right:10px;
}
.send-btn{
  padding:12px 20px;
  border-radius:12px;
  background:#6366F1;
  color:white;
  border:none;
  cursor:pointer;
  font-weight:bold;
}
.send-btn:hover{
  transform:scale(1.05);
}
.username{
  font-weight:bold;
  color:#1E3A8A;
}
#room-title{
  text-align:center;
  font-weight:bold;
  font-size:1.2rem;
  margin-bottom:10px;
}
</style>
</head>
<body>
<header>
  <img src="logo.png" alt="Logo" class="zoom-logo">
  <span>Side Talk - Free Chat Room</span>
</header>

<div class="chat-container">
  <div id="username-display"></div>
  <div id="room-title"></div>
  <div id="messages"></div>
  <div style="display:flex; justify-content:center; margin-top:10px;">
    <input type="text" id="msg-input" placeholder="Type a message...">
    <button class="send-btn" onclick="sendMessage()">Send</button>
  </div>
</div>
</body>
</html>
